<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patient Record System - Login</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script type="module" src="./js/login.js?v=20261002"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="./css/style.css"/>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">🏥</div>
    <div class="text-center mb-4">
      <h4 class="mb-1">Patient Record System</h4>
      <p class="text-muted mb-0" style="font-size:.875rem;">Sign in to your account</p>
    </div>

    <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" placeholder="Enter username" autocomplete="username"/>
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" placeholder="Enter password" autocomplete="current-password"/>
    </div>

    <button type="button" class="btn-login" id="btn-login">Sign In</button>

    <p class="text-center text-muted mt-3 mb-0" style="font-size:.85rem;">
      Need an account? Contact your administrator.
    </p>
  </div>
</body>
</html>
